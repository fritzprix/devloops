\* Main configuration: the model of the code as it is (Fixes = {}), one issue,
\* two worker slots, checked for the safety properties that hold.
\* spec/run-tlc.sh runs every other property and the liveness checks.
SPECIFICATION Spec
CONSTANTS
    Issues = {1}
    Workers = {w1, w2}
    MaxRounds = 2
    Env = {"blocker", "defect", "ownerComment", "ciFail", "needsUser", "implFail", "stale"}
    Gated = FALSE
    PmSlots = 0
    MergeMode = "signoff"
    Fixes = {}
INVARIANTS
    TypeOK
    OnlyOneMayPush
CHECK_DEADLOCK FALSE
