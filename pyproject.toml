[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devloops"
version = "0.1.0"
description = "Reusable agent-loop skills for coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "fritzprix" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
devloops = "devloops_lib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devloops_lib"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "devloops_lib/assets/skills"
"templates" = "devloops_lib/assets/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/devloops_lib",
    "/skills",
    "/templates",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
]
